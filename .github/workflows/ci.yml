name: CI

on:
  push:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # uv reads .python-version (3.12) itself and provisions a matching
        # interpreter on `uv sync` — no separate Python setup step needed.

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Dependency vulnerability scan (pip-audit)
        run: uvx pip-audit

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type-check (mypy --strict on the package)
        run: uv run mypy pulseguard/

      - name: Unit + integration tests
        run: uv run pytest tests/ -v --ignore=tests/evals

  evals:
    runs-on: ubuntu-latest
    needs: verify
    # Real, paid Anthropic API calls — scoped to master pushes and PRs only,
    # not every branch push, so routine feature-branch commits during
    # development never trigger real spend without a deliberate merge/PR.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Resolver draft-quality regression gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest tests/evals/ -v

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
