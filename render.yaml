services:
  - type: keyvalue
    name: pulseguard-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: pulseguard-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulseguard-redis
          property: connectionString
      - key: PULSEGUARD_API_KEY
        generateValue: true
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: MONITORED_CARRIERS
        value: verizon,tmobile,att
      # No browser calls this API directly — the frontend's server-side
      # proxy holds PULSEGUARD_API_KEY and isn't subject to CORS — so this
      # is defense-in-depth, not something the working app depends on.
      - key: ALLOWED_ORIGINS
        value: https://pulseguard-console.vercel.app
      # Rate limiting only trusts CF-Connecting-IP / X-Forwarded-For from a
      # request whose direct TCP peer is listed here — otherwise any caller
      # could spoof those headers to bypass the limiter. Left unset until
      # Render's actual ingress IP(s) for this service are confirmed
      # (Dashboard → pulseguard-gateway → Connect → outbound/inbound IPs);
      # until then the limiter safely falls back to the shared proxy IP.
      - key: TRUSTED_PROXY_IPS
        value: ""
      # Set for real functionality after the first deploy (Dashboard →
      # pulseguard-gateway → Environment) — free-tier secrets aren't
      # something a Blueprint should carry in git:
      #   ANTHROPIC_API_KEY   (required — powers all 4 agents)
      #   SLACK_WEBHOOK_URL, SENDGRID_API_KEY  (optional — escalation notifications)
      #   WEBHOOK_URL, WEBHOOK_SECRET, TEAMS_WEBHOOK_URL, ZENDESK_SUBDOMAIN/EMAIL/API_TOKEN,
      #     FRESHDESK_DOMAIN/API_KEY  (optional — enterprise integrations, each independently on/off)
      #   REDDIT_CLIENT_ID, REDDIT_CLIENT_SECRET, X_BEARER_TOKEN
      #     (optional — each adapter degrades gracefully / just skips its
      #     source if unset, so neither blocks startup)
      - key: ANTHROPIC_API_KEY
        sync: false
