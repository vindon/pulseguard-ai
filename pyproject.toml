[project]
name = "pulseguard-ai"
version = "0.1.0"
description = "Autonomous social feed triage system for telecom CX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    # Async / HTTP
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4",
    # LangChain / LangGraph / LangSmith
    "langchain>=0.2,<0.4",
    "langchain-anthropic>=0.1,<0.4",
    "langgraph>=0.2,<0.4",
    "langsmith>=0.1,<0.3",
    # Anthropic SDK
    "anthropic>=0.30,<1",
    # MCP
    "fastmcp>=0.9,<2",
    # Redis
    "redis[hiredis]>=5.0,<6",
    # Feed adapters
    "praw>=7.7,<8",
    "google-play-scraper>=1.2,<2",
    # app-store-scraper omitted — pins requests==2.23.0 which conflicts with urllib3 2.x
    # App Store reviews fetched via Apple's public RSS JSON API (no library needed)
    # Vector KB
    "chromadb>=0.5,<1",
    "sentence-transformers>=3.0,<4",
    # FastAPI gateway
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "slowapi>=0.1.9,<0.2",
    "prometheus-client>=0.20,<1",
    # Notifications
    "slack-sdk>=3.27,<4",
    "sendgrid>=6.11,<7",
    "aiosmtplib>=3.0,<4",
    # Observability
    "structlog>=24.1,<25",
    "opentelemetry-sdk>=1.24,<2",
    # Security
    "python-multipart>=0.0.9,<1",
    # Force urllib3 2.x — 1.25.x bundles six which is missing in modern envs
    "urllib3>=2.0,<3",
    # Utils
    "tenacity>=8.3,<9",
    "pybloom-live>=4.0,<5",
    "schedule>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.14,<4",
    "respx>=0.21,<1",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "black>=24.4,<25",
    "types-redis>=4.6,<5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before importing agent/orchestrator modules, since
# ChatAnthropic and LangSmith read env vars directly at import time.
"pulseguard/gateway/main.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["pulseguard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
